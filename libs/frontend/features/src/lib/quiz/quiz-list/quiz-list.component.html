<div class="container mt-4">
    <h2 class="mb-4">Quiz Overzicht</h2>
  
    <ul class="list-group shadow-sm">
      <li class="list-group-item d-flex justify-content-between align-items-center" *ngFor="let quiz of quizzes">
        <div class="ms-2 me-auto">
          <div class="fw-bold">
            <a [routerLink]="['/quiz', quiz._id]" class="text-decoration-none text-dark">
              {{ quiz.title }}
            </a>
          </div>
          <small class="text-muted">{{ quiz.description }}</small>
          <br />
          <span class="badge bg-info text-dark mt-2">Moeilijkheid: {{ quiz.difficulty }}</span>
        </div>
        <button (click)="deleteQuiz(quiz._id)" class="btn btn-sm btn-danger">Verwijder</button>
      </li>
    </ul>
  
    <div class="text-end mt-3">
      <a [routerLink]="['/quiz/new']" class="btn btn-secondary">Quiz aanmaken</a>
    </div>
  </div>
