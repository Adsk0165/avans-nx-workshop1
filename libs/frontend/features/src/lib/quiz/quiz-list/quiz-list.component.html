<table class="table table-border table-hover">
    <thead>
        <tr>
            <th>id</th>
            <th>Title</th>
            <th>Beschrijving</th>
            <th>Moeilijkheid/th>
            <th>Acties</th>
        </tr>
    </thead>
    <tbody>
        <tr *ngFor="let quiz of quizzes">
            <td>{{ quiz._id }}</td>
            <td>
                <a [routerLink]="['/quiz', quiz._id]">
                    {{ quiz.title }}
                </a>
            </td>
            <td>{{ quiz.description }}</td>
            <td>{{ quiz.difficulty }}</td>
            <td>
                <button (click)="deleteQuiz(quiz._id)" class="btn btn-danger">verwijder</button>
            </td>
        </tr>
    </tbody>
</table>

<button type="button" class="btn btn-secondary" style="margin-top: 10px; text-decoration: none !important;">
    <a [routerLink]="['/quiz/new']" style="text-decoration: none; color: white;">Quiz aanmaken</a>
</button>
