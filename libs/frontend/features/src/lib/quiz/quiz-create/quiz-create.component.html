<div class="container">
  <h2>Create Quiz</h2>
  <form (ngSubmit)="onSubmit()" #userForm="ngForm">
    <div class="form-group">
      <label for="name">title:</label>
      <input
        type="text"
        id="name"
        class="form-control"
        [(ngModel)]="quiz.title"
        name="title"
        required
      />
    </div>
    <div class="form-group">
      <label for="email">discription:</label>
      <input
        type="email"
        id="email"
        class="form-control"
        [(ngModel)]="quiz.description"
        name="email"
        required
      />
    </div>
    <button type="submit" class="btn btn-primary" [disabled]="userForm.invalid">
      Create User
    </button>
  </form>
</div>
