<div class="container">
  <h2>Nieuwe Quiz Aanmaken</h2>

  <ul class="nav nav-tabs mb-3">
    <li class="nav-item">
      <a class="nav-link" [class.active]="activeTab === 'api'" (click)="activeTab = 'api'">Vragen via API</a>
    </li>
    <li class="nav-item">
      <a class="nav-link" [class.active]="activeTab === 'custom'" (click)="activeTab = 'custom'">Eigen vragen</a>
    </li>
  </ul>

  <form (ngSubmit)="onSubmit()" #quizForm="ngForm">
       <div class="form-group">
      <label>Titel:</label>
      <input type="text" [(ngModel)]="quiz.title" name="title" required class="form-control" />
    </div>
    <div class="form-group">
      <label>Beschrijving:</label>
      <textarea [(ngModel)]="quiz.description" name="description" required class="form-control"></textarea>
    </div>
    <div class="form-group">
      <label>Moeilijkheid:</label>
      <select [(ngModel)]="quiz.difficulty" name="difficulty" required class="form-control">
        <option value="Easy">Makkelijk</option>
        <option value="Medium">Gemiddeld</option>
        <option value="Hard">Moeilijk</option>
      </select>
    </div>
    <div class="form-group">
      <label>Categorie:</label>
      <select [(ngModel)]="quiz.category" name="category" required class="form-control">
        <option *ngFor="let category of categories" [value]="category.value">{{ category.label }}</option>
      </select>
    </div>

    <div *ngIf="activeTab === 'custom'" class="form-group">
      <h4>Selecteer je eigen vragen</h4>
      <div *ngFor="let question of allOwnQuestions" class="custom-question">
        <label>
          <input
            type="checkbox"
            [checked]="isSelected(question)"
            (change)="toggleQuestionSelection(question)"
          />
          {{ question.title }} – {{ question.difficulty }}
        </label>
      </div>
    </div>
   
    <div *ngIf="activeTab === 'api'">
      <p>Laat hier jouw bestaande API-quiz functionaliteit staan (zoals random genereren).</p>
    </div>

    <button type="submit" class="btn btn-primary mt-3" [disabled]="quizForm.invalid">
      Quiz opslaan
    </button>
  </form>
</div>
