<div class="container">
  <h2>Create Quiz</h2>
  <form (ngSubmit)="onSubmit()" #quizForm="ngForm">
    <div class="form-group">
      <label for="title">Titel:</label>
      <input
        type="text"
        id="title"
        class="form-control"
        [(ngModel)]="quiz.title"
        name="title"
        required
      />
    </div>
    <div class="form-group">
      <label for="description">Beschrijving:</label>
      <textarea
        id="description"
        class="form-control"
        [(ngModel)]="quiz.description"
        name="description"
        rows="4"
        required
      ></textarea>
    </div>
    <div class="form-group">
      <label for="difficulty">Moeilijkheid:</label>
      <select
        id="difficulty"
        class="form-control"
        [(ngModel)]="quiz.difficulty"
        name="difficulty"
        required
      >
        <option value="Easy">Makkelijk</option>
        <option value="Medium">Midelmatig</option>
        <option value="Hard">Moeilijk</option>
      </select>
    </div>
    <div class="form-group">
      <label for="category">Categorie:</label>
      <select
        id="category"
        class="form-control"
        [(ngModel)]="quiz.category"
        name="category"
        required
      >
        <option *ngFor="let category of categories" [value]="category.value">
          {{ category.label }}
        </option>
      </select>
    </div>
    <div class="form-group form-check">
      <input
        type="checkbox"
        id="isActive"
        class="form-check-input"
        [(ngModel)]="quiz.isActive"
        name="isActive"
      />
      <label class="form-check-label" for="isActive">Is actief</label>
    </div>
    <button type="submit" class="btn btn-primary" [disabled]="quizForm.invalid">
      Create Quiz
    </button>
  </form>
</div>
