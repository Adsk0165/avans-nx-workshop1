<div class="container py-5">
  <div class="card mx-auto shadow-lg rounded" style="max-width: 600px;">
    <div class="card-body">
      <h2 class="card-title text-center mb-4">Edit Quiz</h2>
      <form (ngSubmit)="saveChanges()">
        <div class="form-group">
          <label for="title">Title:</label>
          <input
            id="title"
            [(ngModel)]="quiz.title"
            name="title"
            type="text"
            class="form-control"
            required
          />
        </div>
        <div class="form-group">
          <label for="description">Beschrijving:</label>
          <input
            id="description"
            [(ngModel)]="quiz.description"
            name="description"
            type="text"
            class="form-control"
            required
          />
        </div>
        <div class="form-group">
          <label for="difficulty">Moeilijkheid:</label>
          <select
            id="difficulty"
            [(ngModel)]="quiz.difficulty"
            name="difficulty"
            class="form-control"
            required
          >
            <option value="Easy">Makkelijk</option>
            <option value="Medium">Midelmatig</option>
            <option value="Hard">Moeilijk</option>
          </select>
        </div>
        <div class="form-group">
          <label for="category">Categorie:</label>
          <select
            id="category"
            [(ngModel)]="quiz.category"
            name="category"
            class="form-control"
            required
          >
            <option *ngFor="let category of categories" [value]="category.value">
              {{ category.label }}
            </option>
          </select>
        </div>
        <button type="submit" class="btn btn-primary btn-block mt-4">opslaan</button>
      </form>
    </div>
  </div>
</div>
