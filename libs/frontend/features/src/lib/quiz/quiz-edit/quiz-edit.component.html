<h2>Edit Quiz</h2>
<form>
  <div>
    <label for="title">Title:</label>
    <input id="title" [(ngModel)]="quiz.title" name="title" type="text" />
  </div>

  <div>
    <label for="description">Description:</label>
    <input id="description" [(ngModel)]="quiz.description" name="description" type="text" />
  </div>
  
  <div>
    <label for="difficulty">Difficulty:</label>
    <select id="difficulty" [(ngModel)]="quiz.difficulty" name="difficulty">
      <option value="Easy">Easy</option>
      <option value="Medium">Medium</option>
      <option value="Hard">Hard</option>
    </select>
  </div>

  <!-- Category dropdown -->
  <div>
    <label for="category">Category:</label>
    <select id="category" [(ngModel)]="quiz.category" name="category">
      <option *ngFor="let category of categories" [value]="category.value">{{ category.label }}</option>
    </select>
  </div>

  <button type="button" (click)="saveChanges()">Save Changes</button>
</form>
