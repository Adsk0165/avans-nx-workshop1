<div class="container py-5">
  <div class="card mx-auto shadow-lg rounded" style="max-width: 600px;">
    <div class="card-body">
      <h2 class="card-title text-center mb-4">Edit Quiz</h2>

      <form #quizForm="ngForm" (ngSubmit)="saveChanges()">
        <div class="form-group">
          <label for="title">Titel:</label>
          <input
            id="title"
            name="title"
            type="text"
            class="form-control"
            [(ngModel)]="quiz.title"
            required
            minlength="5"
            #title="ngModel"
          />
          <div *ngIf="title.invalid && title.touched" class="text-danger mt-1">
            <small *ngIf="title.errors?.['required']">Titel is verplicht.</small>
            <small *ngIf="title.errors?.['minlength']">Minimaal 5 tekens.</small>
          </div>
        </div>

        <div class="form-group">
          <label for="description">Beschrijving:</label>
          <input
            id="description"
            name="description"
            type="text"
            class="form-control"
            [(ngModel)]="quiz.description"
            required
            minlength="5"
            maxlength="150"
            #description="ngModel"
          />
          <div *ngIf="description.invalid && description.touched" class="text-danger mt-1">
            <small *ngIf="description.errors?.['required']">Beschrijving is verplicht.</small>
            <small *ngIf="description.errors?.['minlength']">Minimaal 5 tekens.</small>
            <small *ngIf="description.errors?.['maxlength']">Maximaal 150 tekens.</small>
          </div>
        </div>
        <div class="form-group">
          <label for="difficulty">Moeilijkheid:</label>
          <select
            id="difficulty"
            [(ngModel)]="quiz.difficulty"
            name="difficulty"
            class="form-control"
            required
          >
            <option value="Easy">Makkelijk</option>
            <option value="Medium">Midelmatig</option>
            <option value="Hard">Moeilijk</option>
          </select>
        </div>
        <div class="form-group">
          <label for="category">Categorie:</label>
          <select
            id="category"
            [(ngModel)]="quiz.category"
            name="category"
            class="form-control"
            required
          >
            <option *ngFor="let category of categories" [value]="category.value">
              {{ category.label }}
            </option>
          </select>
        </div>
        <button type="submit" class="btn btn-primary btn-block mt-4">opslaan</button>
      </form>
    </div>
  </div>
</div>
