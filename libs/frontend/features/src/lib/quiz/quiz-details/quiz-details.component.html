<div class="container py-5">
  <!-- Quiz Details -->
  <div class="card shadow-lg rounded p-4">
    <h5 class="card-title">{{ quiz?.title }}</h5>
    <p class="profile-rating">Moeilijkheid: <span class="badge badge-info">{{ quiz?.difficulty }}</span></p>
    <p>{{ quiz?.description }}</p>
    <p>Status: <strong>{{ quiz?.isActive ? 'Active' : 'Inactive' }}</strong></p>
    <div class="mt-3">
      <a [routerLink]="['/quizedit', quiz?._id]">
        <button type="button" class="btn btn-info btn-lg">bewerk deze quiz</button>
      </a>
    </div>
    <div class="mt-3">
    <button
      type="button"
      class="btn btn-warning btn-lg"
      (click)="toggleFavorite()"
      [innerText]="isFavorited ? 'Verwijder uit favorieten' : 'Favoriet'">
    </button>
    </div> 
    <div class="mt-3">
      <button class="btn btn-success btn-lg" (click)="startQuiz()">Start Quiz</button>
    </div>
  </div>
  <div class="comments-section mt-5">
    <h5>Comments</h5>
    <ul class="list-group mb-4">
      <li *ngFor="let comment of comments" class="list-group-item d-flex justify-content-between align-items-start">
        <div>
          <p><strong>Comment:</strong> {{ comment.comment }}</p>
          <small class="text-muted">Door User ID: {{ comment.userId }} | Gemaakt op: {{ comment.createdAt | date:'short' }}</small>
        </div>
        <div *ngIf="comment.userId === userId || isAdmin" class="d-flex align-items-center">
          <button type="button" class="btn btn-outline-info btn-sm mr-2" (click)="editComment(comment)" style="margin-right: 10px; margin-top: 17px;">
            <i class="fas fa-pencil-alt"></i> bewerk
          </button>
          <button type="button" class="btn btn-outline-danger btn-sm" (click)="deleteComment(comment._id)" style="margin-top: 17px">
            <i class="fas fa-trash-alt"></i> verwijder
          </button>
        </div>
      </li>
    </ul>
    <div *ngIf="editingComment === null">
      <textarea [(ngModel)]="newComment" class="form-control" rows="3" placeholder="Add a comment..."></textarea>
      <button class="btn btn-primary mt-2" (click)="addComment()">verstuur</button>
    </div>
    <div *ngIf="editingComment !== null">
      <textarea [(ngModel)]="editingComment.comment" class="form-control" rows="3" placeholder="Edit your comment..."></textarea>
      <button class="btn btn-warning mt-2" (click)="saveEdit()" style="margin-right: 10px;">opslaan</button>
      <button class="btn btn-secondary mt-2" (click)="cancelEdit()">Cancel</button>
    </div>
  </div>
</div>
