<div class="container mt-5">
  <h2 class="text-center mb-4">bewerk User</h2>
  <form>
    <div class="form-group">
      <label for="name">Naam</label>
      <input 
        type="text" 
        class="form-control" 
        id="name" 
        [(ngModel)]="user.name" 
        name="name" 
        required 
        placeholder="Vul hier een gebruikersnaam in"
      />
    </div>
    <div class="form-group">
      <label for="emailAddress">Email</label>
      <input 
        type="email" 
        class="form-control" 
        id="emailAddress" 
        [(ngModel)]="user.emailAddress" 
        name="emailAddress" 
        required 
        placeholder="Vul hier een geldig emailAddress in"
      />
    </div>
    <div class="form-group">
      <label for="role">Rol</label>
      <select 
        class="form-control" 
        id="role" 
        [(ngModel)]="user.role" 
        name="role" 
        required
      >
        <option value="admin">Admin</option>
        <option value="user">User</option>
      </select>
    </div>
    <div class="form-check mb-3">
      <input 
        type="checkbox" 
        class="form-check-input" 
        id="isActive" 
        [(ngModel)]="user.isActive" 
        name="isActive" 
      />
      <label class="form-check-label" for="isActive">ACtief</label>
    </div>
    <button type="button" class="btn btn-primary btn-block" (click)="saveChanges()">Gegevens Opslaan</button>
  </form>
</div>
