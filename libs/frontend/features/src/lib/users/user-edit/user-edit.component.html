<div class="vraag-container">
  <h1>User Bewerken</h1>
  <form (ngSubmit)="saveChanges()" #userForm="ngForm" class="vraag-form" novalidate>
    <div class="form-group">
      <label for="name">Voornaam</label>
      <input
        type="text"
        id="name"
        class="form-control"
        [(ngModel)]="user.name"
        name="name"
        required
        pattern="^[A-Za-zÀ-ÿ\s'-]{3,100}$"
        #nameRef="ngModel"
        placeholder="Vul hier een geldige gebruikersnaam in"
      />
      <div *ngIf="nameRef.invalid && nameRef.touched" class="text-danger">
        <small *ngIf="nameRef.errors?.['required']">Naam is verplicht.</small>
        <small *ngIf="nameRef.errors?.['pattern']">
          Naam moet tussen 3 en 100 tekens bevatten, en mag geen cijfers of symbolen zoals @ en & bevatten.
        </small>
      </div>
    </div>

    <div class="form-group">
      <label for="emailAddress">E-mailadres</label>
      <input
        type="email"
        id="emailAddress"
        class="form-control"
        [(ngModel)]="user.emailAddress"
        name="emailAddress"
        required
        email
        #emailRef="ngModel"
        placeholder="Vul hier een geldig e-mailadres in"
      />
      <div *ngIf="emailRef.invalid && emailRef.touched" class="text-danger">
        <small *ngIf="emailRef.errors?.['required']">E-mailadres is verplicht.</small>
        <small *ngIf="emailRef.errors?.['email']">Vul een geldig e-mailadres in.</small>
      </div>
    </div>
    <div class="form-group">
      <label for="role">Rol</label>
      <select
        id="role"
        class="form-control"
        [(ngModel)]="user.role"
        name="role"
        required
      >
        <option value="admin">Admin</option>
        <option value="user">User</option>
      </select>
    </div>

    <button type="submit" class="btn-submit" [disabled]="userForm.invalid">
      Gegevens Opslaan
    </button>
  </form>
</div>
