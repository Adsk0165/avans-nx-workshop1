<div class="container mt-4">
  <h2>Gebruikers lijst</h2>
  <table class="table table-striped table-hover">
    <thead>
      <tr>
        <th>Id</th>
        <th>Naam</th>
        <th>Email</th>
        <th>IsActief</th>
        <th>Image URL</th>
        <th>Acties</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let user of users; let i = index">
        <td>{{ user._id }}</td>
        <td>
          <a [routerLink]="['/user', user._id]">
            {{ user.name }}
          </a>
        </td>
        <td>{{ user.emailAddress }}</td>
        <td>{{ user.isActive }}</td>
        <td>
          <img [src]="user.profileImgUrl" alt="Profile Image" class="img-fluid" 
               style="width: 50px; height: 50px; object-fit: cover;">
        </td>
        <td>
          <button *ngIf="currentUserRole === 'admin' || user._id === currentUserId"
                  (click)="deleteUser(user._id, i)"
                  class="btn btn-danger" style="margin-top: 5px;">
            verwijder
          </button>
        </td>
      </tr>
    </tbody>
  </table>
  <button *ngIf="currentUserRole === 'admin'" 
          type="button" 
          class="btn btn-secondary mt-3">
    <a [routerLink]="['/users/new']" class="text-white" style="text-decoration: none;">Voeg een user toe</a>
  </button>
</div>
