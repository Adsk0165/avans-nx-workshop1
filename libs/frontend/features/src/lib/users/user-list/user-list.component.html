<div class="container py-5">
  <h2 class="text-center mb-4 text-black">Users overzicht</h2>

  <div class="row">
    <div
      class="col-md-6 col-lg-4 mb-4"
      *ngFor="let user of users; let i = index"
    >
      <div class="card text-center h-100 shadow user-card">
        <img
          [src]="user.profileImgUrl || 'https://via.placeholder.com/100'"
          alt="Profielfoto"
          class="rounded-circle mx-auto mt-3"
          style="width: 100px; height: 100px; object-fit: cover;"
        />
        <div class="card-body">
          <h5 class="card-title">
            <a [routerLink]="['/user', user._id]" class="text-dark text-decoration-none">
              {{ user.name }}
            </a>
          </h5>
          <p class="text-muted mb-1">{{ user.emailAddress }}</p>
          <p class="text-muted mb-2">Rol: {{ user.role }} | {{ user.gender }}</p>

          <button
            *ngIf="currentUserRole === 'admin' || user._id === currentUserId"
            (click)="deleteUser(user._id, i)"
            class="btn btn-danger btn-sm mt-2"
          >
            Verwijder
          </button>
        </div>
      </div>
    </div>
  </div>

  <div class="text-center mt-4" *ngIf="currentUserRole === 'admin'">
    <a [routerLink]="['/users/new']" class="btn btn-secondary">
      Voeg een User toe
    </a>
  </div>
</div>
