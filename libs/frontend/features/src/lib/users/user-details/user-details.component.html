<div class="container d-flex justify-content-center align-items-center ">
    <div class="card p-4 shadow" style="width: 50%; border: 1px solid #ddd;">
      <div *ngIf="user; else noUser">
        <div class="text-center">
          <img 
            [src]="user.profileImgUrl || 'https://via.placeholder.com/150'" 
            alt="Profile Image" 
            class="rounded-circle img-fluid mb-3" 
            style="max-width: 150px; height: 150px; object-fit: cover;"
          />
          <h2>{{ user.name }}</h2>
          <h6 class="text-muted">{{ user.role }}</h6>
        
        </div>
        <div class="mt-4">
          <div class="row">
            <div class="col-6 text-right">
              <strong>Email:</strong>
            </div>
            <div class="col-6">
              <p>{{ user.emailAddress }}</p>
            </div>
          </div>
          <div class="row">
            <div class="col-6 text-right">
              <strong>Gender:</strong>
            </div>
            <div class="col-6">
              <p>{{ user.gender }}</p>
            </div>
          </div>
          <div class="row">
            <div class="col-6 text-right">
              <strong>Status:</strong>
            </div>
            <div class="col-6">
              <p>{{ user.isActive ? 'Active' : 'Inactive' }}</p>
            </div>
          </div>
        </div>
        <div class="text-center mt-4">
          <a [routerLink]="['/edit', user._id]" class="btn btn-primary">User bewerken</a>
        </div>
      </div>
      <ng-template #noUser>
        <p class="text-danger text-center">User niet gevonden!</p>
      </ng-template>
    </div>
  </div>
