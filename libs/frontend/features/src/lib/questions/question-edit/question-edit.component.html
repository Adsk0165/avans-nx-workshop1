<div class="vraag-container">
    <h1>Vraag Bewerken</h1>
  
    <form
      class="vraag-form"
      *ngIf="updatedQuestion?.options?.length"
      (ngSubmit)="onSubmit()"
    >
    <div class="form-group">
        <label for="title">Titel</label>
        <input
          type="text"
          id="title"
          name="title"
          [(ngModel)]="updatedQuestion.title"
          #titleField="ngModel"
          [required]="true"
          minlength="5"
          maxlength="150"
        />
        <div class="text-danger" *ngIf="titleField.invalid && titleField.touched">
          <small *ngIf="titleField.errors?.['required']">Titel is verplicht.</small>
          <small *ngIf="titleField.errors?.['minlength']">Minimaal 5 tekens.</small>
          <small *ngIf="titleField.errors?.['maxlength']">Maximaal 150 tekens.</small>
        </div>
      </div>
  
  
      <div class="form-group">
        <label for="description">Omschrijving</label>
        <input
          type="text"
          id="description"
          name="description"
          [(ngModel)]="updatedQuestion.description"
          #descField="ngModel"
          [required]="true"
          minlength="5"
          maxlength="150"
        />
        <div class="text-danger" *ngIf="descField.invalid && descField.touched">
          <small *ngIf="descField.errors?.['required']">Omschrijving is verplicht.</small>
          <small *ngIf="descField.errors?.['minlength']">Minimaal 5 tekens.</small>
          <small *ngIf="descField.errors?.['maxlength']">Maximaal 150 tekens.</small>
        </div>
      </div>
  
      <div
        class="form-group"
        *ngFor="let option of updatedQuestion.options; let i = index; trackBy: trackByIndex"
      >
        <label for="option{{ i }}">Optie {{ i + 1 }}</label>
        <input
          type="text"
          id="option{{ i }}"
          [(ngModel)]="updatedQuestion.options![i]"
          name="option{{ i }}"
          required
        />
      </div>

      <div class="text-danger" *ngIf="!hasMinimumOptions()">
        Minimaal 2 antwoordopties zijn verplicht.
      </div>
      
  
      <div class="form-group">
        <label for="correctAnswer">Correct Antwoord</label>
        <select
          id="correctAnswer"
          [(ngModel)]="updatedQuestion.correctAnswer"
          name="correctAnswer"
          required
        >
          <option *ngFor="let option of updatedQuestion.options" [value]="option">
            {{ option || '(leeg)' }}
          </option>
        </select>
      </div>
  
      <div class="form-group">
        <label for="difficulty">Moeilijkheidsgraad</label>
        <select
          id="difficulty"
          [(ngModel)]="updatedQuestion.difficulty"
          name="difficulty"
          required
        >
          <option value="Easy">Makkelijk</option>
          <option value="Medium">Gemiddeld</option>
          <option value="Hard">Moeilijk</option>
        </select>
      </div>
  
      <div class="form-group">
        <label for="tags">Tags (gescheiden met komma’s)</label>
        <input
          type="text"
          id="tags"
          [(ngModel)]="tagString"
          name="tags"
        />
      </div>


      
  
      <div class="button-group">
        <button type="submit"  class="btn-submit">Opslaan</button>
        <button type="button" class="btn-submit btn-cancel" (click)="navigateBack()">
          Annuleren
        </button>
      </div>
    </form>
  </div>
