<div class="auth-container">
  <h2 class="auth-header">Registreer</h2>

  <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="auth-form">
    <div class="form-group">
      <label for="firstname" class="form-label">Voornaam</label>
      <input id="firstname" formControlName="firstname" type="text" class="form-control" placeholder="Vul hier je voornaam in" />
    </div>

    <div class="form-group">
      <label for="lastname" class="form-label">Achternaam</label>
      <input id="lastname" formControlName="lastname" type="text" class="form-control" placeholder="Vul hier je achternaam in" />
    </div>

    <div class="form-group">
      <label for="email" class="form-label">Email Address</label>
      <input id="email" formControlName="email" type="email" class="form-control" placeholder="Vul hier je email in" />
    </div>

    <div class="form-group">
      <label for="password" class="form-label">Wachtwoord</label>
      <input id="password" formControlName="password" type="password" class="form-control" placeholder="Vul hier je wachtwoord in" />
    </div>

    <button type="submit" class="btn btn-primary btn-block" [disabled]="registerForm.invalid">
      registreer
    </button>
  </form>
</div>
