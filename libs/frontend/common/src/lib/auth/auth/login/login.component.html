<div class="auth-container">
  <h2 class="auth-header">Login</h2>

  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="auth-form" novalidate>
    <div class="form-group">
      <label for="emailAddress" class="form-label">Email addres</label>
      <input
        id="emailAddress"
        formControlName="emailAddress"
        type="email"
        class="form-control"
        placeholder="Vul hier je email in"
        [class.is-invalid]="loginForm.get('emailAddress')?.invalid && loginForm.get('emailAddress')?.touched"
      />
      <div *ngIf="loginForm.get('emailAddress')?.invalid && loginForm.get('emailAddress')?.touched" class="invalid-feedback">
        Vul hier een geldig email addres in.
      </div>
    </div>

    <div class="form-group">
      <label for="password" class="form-label">Wachtwoord</label>
      <input
        id="password"
        formControlName="password"
        type="password"
        class="form-control"
        placeholder="Vul hier je wachtwoord in"
        [class.is-invalid]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
      />
      <div *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched" class="invalid-feedback">
        Wachtwoord moet tussen de 3 en 15 characters lang zijn.
      </div>
    </div>

    <div *ngIf="loginError" class="alert alert-danger">
      {{ loginError }}
    </div>

    <button type="submit" class="btn btn-primary btn-block" [disabled]="loginForm.invalid" style="margin-top: 10px;">
      Login
    </button>
  </form>

  <div class="auth-footer" style="padding-top: 10px;">
    <a routerLink="/register"><p>Heb je geen account? Druk dan rechts boven op registreer</p></a>
  </div>
</div>
